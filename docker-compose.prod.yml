services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile.prod
    image: retourenjournal/app:${APP_IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file:
      - ./backend/.env.production
    environment:
      APP_ENV: production
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: ${POSTGRES_DB}
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - app-storage:/var/www/html/backend/storage
      - app-cache:/var/www/html/backend/bootstrap/cache
    extra_hosts:
      - "mail.retourenjournal.de:${MAIL_HOST_GATEWAY:-172.18.0.1}"
    networks:
      - internal

  nginx:
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile.prod
    image: retourenjournal/nginx:${APP_IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      - app
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
    ports:
      - "80:80"
    volumes:
      - certbot-webroot:/var/www/certbot
    networks:
      - internal
      - public

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata-prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  certbot:
    image: certbot/certbot:latest
    profiles:
      - certbot
    volumes:
      - certbot-webroot:/var/www/certbot
      - letsencrypt:/etc/letsencrypt

  queue:
    image: retourenjournal/app:${APP_IMAGE_TAG:-latest}
    profiles:
      - workers
    restart: unless-stopped
    env_file:
      - ./backend/.env.production
    environment:
      APP_ENV: production
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: ${POSTGRES_DB}
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
    command: php artisan queue:work --sleep=3 --tries=3 --timeout=90
    volumes:
      - app-storage:/var/www/html/backend/storage
      - app-cache:/var/www/html/backend/bootstrap/cache
    extra_hosts:
      - "mail.retourenjournal.de:${MAIL_HOST_GATEWAY:-172.18.0.1}"
    networks:
      - internal

  scheduler:
    image: retourenjournal/app:${APP_IMAGE_TAG:-latest}
    profiles:
      - workers
    restart: unless-stopped
    env_file:
      - ./backend/.env.production
    environment:
      APP_ENV: production
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: ${POSTGRES_DB}
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "while true; do php artisan schedule:run --no-interaction; sleep 60; done"
    volumes:
      - app-storage:/var/www/html/backend/storage
      - app-cache:/var/www/html/backend/bootstrap/cache
    extra_hosts:
      - "mail.retourenjournal.de:${MAIL_HOST_GATEWAY:-172.18.0.1}"
    networks:
      - internal

networks:
  public:
  internal:
    internal: true

volumes:
  pgdata-prod:
  app-storage:
  app-cache:
  certbot-webroot:
  letsencrypt:
